name: Build Surya Gaming Kernel

on:
  workflow_dispatch:
    inputs:
      memkernel_mode:
        description: "MemKernel integration mode"
        required: true
        type: choice
        options:
          - Y
          - M
        default: Y
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: surya-kernel-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build kernel and package AnyKernel3
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl device-tree-compiler \
            flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libelf-dev \
            libncurses-dev libssl-dev lz4 python3 rsync unzip zip zlib1g-dev

      - name: Build kernel
        env:
          MEMKERNEL_MODE: ${{ inputs.memkernel_mode || 'Y' }}
        run: bash scripts/build.sh

      - name: Upload flashable ZIP and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surya-gaming-kernel-build
          path: |
            out/*.zip
            out/build.log
          if-no-files-found: warn
          retention-days: 14
