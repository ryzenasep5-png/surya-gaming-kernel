name: Build StormBreaker v8 (surya)

on:
  workflow_dispatch:
    inputs:
      memkernel_mode:
        description: "Mode MemKernel (Y = built-in, M = module, N = tanpa)"
        type: choice
        options: [Y, M, N]
        default: Y
  push:
    branches: [stormbreaker-v8]
    paths:
      - "scripts/build-stormbreaker.sh"
      - ".github/workflows/build-stormbreaker.yml"
      - "patches/**"

permissions:
  contents: read

concurrency:
  group: sb-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        timeout-minutes: 15
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # Lock dpkg bisa dipegang unattended-upgrades saat runner baru boot:
          sudo apt-get -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 update -qq
          sudo apt-get -o DPkg::Lock::Timeout=180 install -y --no-install-recommends \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi patch libelf-dev libssl-dev \
            bc bison flex device-tree-compiler rsync unzip zip lz4
          echo "== deps siap =="
          which aarch64-linux-gnu-gcc patch clang || true

      - name: Build kernel
        env:
          MEMKERNEL_MODE: ${{ inputs.memkernel_mode || 'Y' }}
        run: bash scripts/build-stormbreaker.sh

      - name: Upload flashable ZIP and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stormbreaker-v8-surya
          path: |
            out/*.zip
            out/build.log
          if-no-files-found: warn
          retention-days: 14
